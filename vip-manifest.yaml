# Handoff manifest for Staged Edits.
#
# The one file WordPress VIP reads to register and load the integration. Check
# it with `npm run validate:integration` (see docs/vip-integration.md).
#
# Keep it in step with the plugin: release.plugin_version must equal the plugin
# header, the VERSION constant and package.json, and runtime_config must match
# includes/class-config.php. The config constant is not declared here: the
# platform derives it from integration.slug as VIP_STAGED_EDITS_CONFIG.
# tests/test-manifest.php enforces all of it.

manifest_version: 2
manifest_kind: vip-integration-handoff

integration:
  slug: staged-edits
  display_name: Staged Edits
  summary: >-
    Edit a published post as a private staged copy. The published post keeps
    serving until someone publishes the change.
  partner:
    name: Automattic
    support_contact: https://github.com/Automattic/staged-edits/issues

documentation:
  public_url: https://github.com/Automattic/staged-edits/blob/main/docs/integration-center.md
  support_url: https://github.com/Automattic/staged-edits/blob/main/docs/alpha-testers.md

runtime:
  wordpress_plugin:
    folder: staged-edits
    entry_file: staged-edits.php
    php_namespace: StagedEdits
    scope: site

runtime_config:
  fields:
    - key: scheduled_publish_overrides_drift
      label: When a scheduled publish finds the published post changed
      type: enum
      values: [never, non_content, always]
      default: never
      required: false
      help: >-
        "never" stops the scheduled publish and keeps the staged copy for a person
        to review (the default). "non_content" publishes anyway when only fields
        that cannot be staged changed (terms, featured image, slug, meta), and
        still stops if the words changed or the change cannot be classified.
        "always" publishes the staged words over any change.

# No telemetry section: the plugin records none.

release:
  plugin_version: 0.3.0-alpha.2
  version_strategy: semantic_versioning
  migration_required: false
  changelog: >-
    WP-CLI help for the staged-edits commands reads as plain sentences, without
    internal reference numbers. No functional changes, and nothing to migrate
    from 0.3.0-alpha.1.
